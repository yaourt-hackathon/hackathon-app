# `docker compose up` : l'app sur http://localhost:3000 et l'API data à côté (jalon m2).
name: note-de-tete

services:
  app:
    build: .
    ports:
      # 127.0.0.1 : pas exposé au reste du réseau (wifi du hackathon)
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      DATA_API_URL: http://data-api:8000
      # demo : scénario embarqué ; api : API data (ADR 0008).
      # `DATA_SOURCE=api docker compose up` pour passer sur l'API.
      DATA_SOURCE: ${DATA_SOURCE:-demo}
    depends_on:
      data-api:
        condition: service_healthy

  data-api:
    # Dépôt data épinglé sur un commit : l'app est testée contre cette version
    # de l'API, pas contre develop qui bouge chaque nuit. Changer de version :
    # remplacer le commit, puis `npm run api:pull` si le contrat a changé.
    build: https://github.com/yaourt-hackathon/data.git#05991a7feeaea343b3de3017c1e090c1947701be
    ports:
      # Pour `npm run dev` hors conteneur (DATA_API_URL=http://localhost:8000)
      - '127.0.0.1:${DATA_API_PORT:-8000}:8000'
