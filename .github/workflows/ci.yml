name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  qualite:
    runs-on: ubuntu-latest
    # Même Node et même Debian que le dev container
    container: node:24-trixie
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      # lint, typecheck, tests, format : la liste vit dans package.json
      - run: npm run check
      - run: npm run build
